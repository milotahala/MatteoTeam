<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tageskarte · Pizzeria Ristorante Matteo</title>
<style>
  body{margin:0;background:#fff7e9;color:#8c201e;font:18px Georgia,serif}
  main{max-width:720px;margin:0 auto;padding:16px}
  .status{padding:20px;text-align:center}
  
      .dailyPaper{box-sizing:border-box;padding:clamp(14px,4vw,34px);color:var(--ink);background:var(--paper);border:2px solid var(--ink);font-family:var(--font);overflow-wrap:anywhere}
      .dailyPaper[data-frame="classic"]{border:6px double var(--ink)}
      .dailyPaper[data-frame="bistro"]{border-radius:24px}
      .dailyPaper[data-frame="modern"]{border-width:5px 1px 5px}
      .dailyPaper header{text-align:center;border-bottom:1px solid var(--ink);padding-bottom:18px;margin-bottom:18px}
      .dailyPaper .dailyBrand{font-size:.78em;letter-spacing:.13em;text-transform:uppercase}
      .dailyPaper h1{font:700 clamp(26px,5vw,42px)/1.12 var(--font);margin:8px 0 0}
      .dailyPaper article{padding:12px 0;border-bottom:1px solid var(--ink);break-inside:avoid}
      .dailyPaper article:last-child{border-bottom:0}
      .dailyPaper .dailyDishHeading{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
      .dailyPaper .dailyDishPrice{white-space:nowrap}
      .dailyPaper p{margin:5px 0 0}
      .dailyPaper .dailyAllergens{font-size:.83em}
      .dailyPaperShort header{margin-bottom:clamp(16px,4vw,32px)}
      .dailyPaperShort .dailyDishes{display:grid;gap:clamp(12px,3vw,24px)}
      .dailyPaperShort article,.dailyPaperShort article:last-child{padding:clamp(14px,4vw,30px);border:1px solid var(--ink);text-align:center}
      .dailyPaperShort[data-frame="bistro"] article{border-radius:16px}
      .dailyPaperShort[data-frame="modern"] article{border-width:1px 0}
      .dailyPaperShort .dailyDishHeading{display:grid;justify-content:center;gap:5px}
      .dailyPaperShort .dailyDishHeading strong{font-size:clamp(20px,4vw,30px)}
      .dailyPaperShort h1,.dailyPaperShort article{break-inside:avoid}
      @media print{.dailyPaperShort{padding:12mm}.dailyPaperShort article,.dailyPaperShort article:last-child{padding:9mm}.dailyPaperShort .dailyDishes{gap:6mm}}

    
</style>
</head>
<body>
<main id="menu"><p class="status" role="status">Tageskarte wird geladen …</p></main>
<script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {getFirestore,doc,getDocFromServer} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    const dailyMenuThemes = new Map([["Matteo Rot", ["#8c201e", "#fff7e9"]], ["Trattoria Grün", ["#254d3a", "#f4f6ee"]], ["Schwarz-Weiß", ["#171717", "#fff"]]]);
    const dailyMenuFonts = new Set(["Georgia", "Arial", "Times New Roman"]);
    const dailyMenuPrice = new Intl.NumberFormat("de-DE", {style:"currency",currency:"EUR"});

    const htmlEscape = value => String(value ?? "").replace(/[&<>"']/g, mark => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[mark]);
    function dailyMenuMarkup(menu){
      const [ink, paper] = dailyMenuThemes.get(menu.design) || dailyMenuThemes.get("Matteo Rot");
      const font = dailyMenuFonts.has(menu.font) ? menu.font : "Georgia";
      const frame = ["classic", "bistro", "modern"].includes(menu.frame) ? menu.frame : "classic";
      const namedDishes = menu.dishes.filter(dish => dish.name);
      const layout = namedDishes.length > 0 && namedDishes.length <= 2 ? " dailyPaperShort" : "";
      const dishes = namedDishes.map(({name, description, allergens, price:rawPrice}) => {
          const price = /^[0-9]{1,6}([.,][0-9]{1,2})?$/.test(rawPrice) ? dailyMenuPrice.format(Number(rawPrice.replace(",", "."))) : rawPrice;
          return `<article>
            <div class="dailyDishHeading"><strong>${htmlEscape(name)}</strong>${price ? `<span class="dailyDishPrice">${htmlEscape(price)}</span>` : ""}</div>
            ${description ? `<p>${htmlEscape(description)}</p>` : ""}
            ${allergens ? `<p class="dailyAllergens">Allergene: ${htmlEscape(allergens)}</p>` : ""}
          </article>`;
        }).join("");
      return `<div class="dailyPaper${layout}" data-frame="${frame}" style="--ink:${ink};--paper:${paper};--font:'${font}'">
        <header><span class="dailyBrand">Pizzeria Ristorante Matteo</span><h1>${htmlEscape(menu.title.trim() || "Tageskarte")}</h1></header>
        <div class="dailyDishes">${dishes}</div>
      </div>`;
    }


    const menu = document.getElementById("menu");
    try {
      const app = initializeApp({apiKey:"AIzaSyBTq_1aKrXLXq20714biUn7qDRBhIBZkMo",authDomain:"matteoteam-test.firebaseapp.com",projectId:"matteoteam-test",storageBucket:"matteoteam-test.firebasestorage.app",messagingSenderId:"1084486170913",appId:"1:1084486170913:web:d68cf328becefe226a6660"});
      const auth = getAuth(app);
      await auth.authStateReady();
      if(!auth.currentUser) await signInAnonymously(auth);
      const snapshot = await getDocFromServer(doc(getFirestore(app), "restaurantMenu", "__dailyMenu"));
      const published = snapshot.data();
      if(published?.published === true && Array.isArray(published.dishes) && published.dishes.some(dish => dish?.name)){
        menu.innerHTML = dailyMenuMarkup({
          ...published,
          title:String(published.title || "Tageskarte"),
          dishes:published.dishes.filter(dish => dish?.name)
        });
      }else{
        menu.querySelector(".status").textContent = "Zurzeit ist keine Tageskarte veröffentlicht.";
      }
    }catch(error){
      console.error(error);
      menu.querySelector(".status").textContent = "Die Tageskarte konnte nicht geladen werden. Bitte lade die Seite erneut.";
    }
</script>
</body>
</html>
