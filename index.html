<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatteoTeam PRO</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0e1a20;
color:white;
}

header{
background:#142c35;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
padding:10px 14px;
border:none;
border-radius:6px;
cursor:pointer;
}

.primary{background:#4dabf7;color:white}
.good{background:#20c997;color:white}
.bad{background:#ff6b6b;color:white}

.card{
background:#132931;
margin:15px;
padding:15px;
border-radius:10px;
}

.hidden{display:none}

input,select{
padding:8px;
border:none;
border-radius:6px;
width:100%;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #284b57;
padding:8px;
text-align:center;
}

textarea{
  width:70px;
  height:40px;
  background:#0e2b34;
  color:white;
  border:1px solid #2f5662;
  border-radius:6px;
  text-align:center;
  font-size:14px;
}

</style>
</head>

<body>

<header>

<h2>MatteoTeam PRO</h2>

<div>

<select id="langSel">
<option value="de">DE</option>
<option value="en">EN</option>
<option value="sq">SQ</option>
</select>

<button id="btnOpenLogin" class="primary">
Login
</button>

<button id="btnLogout" class="bad hidden">
Logout
</button>

</div>

</header>


<div id="loginPanel" class="card hidden">

<h3>Login</h3>

<input id="email" placeholder="Email">

<br><br>

<input id="pass" type="password" placeholder="Password">

<br><br>

<button id="btnLogin" class="primary">Login</button>

<button id="btnRegister">Register</button>

<button id="btnReset">Reset Password</button>

</div>


<div id="appPanel" class="hidden">


<div class="card">

<div class="weekTop">
  <div class="weekTitle">Weekly Plan</div>
  <input id="weekStart" type="date" class="weekPicker">
</div>

<table>

<thead>

<tr>

<th>Staff</th>
<th>Mon</th>
<th>Tue</th>
<th>Wed</th>
<th>Thu</th>
<th>Fri</th>
<th>Sat</th>
<th>Sun</th>

</tr>

</thead>

<tbody id="weeklyBody"></tbody>

</table>

<br>

<button id="btnSaveWeekly" class="good">
Save Weekly
</button>

</div>


<div class="card">

<h3>Staff</h3>

<input id="staffName" placeholder="Staff name">

<br><br>

<button id="btnAddStaff" class="good">
Add Staff
</button>

<div id="staffList"></div>

</div>


<div class="card">

<h3>Inventory</h3>

<input id="invName" placeholder="Item name">

<br><br>

<input id="invQty" type="number" placeholder="Quantity">

<br><br>

<button id="btnAddInv" class="good">
Add Item
</button>

<div id="invList"></div>
</div> <!-- /card Inventory -->

</div> <!-- /appPane (nëse e ke) -->

<script type="module">
/* ==========================
   1) IMPORTS
========================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";


/* ==========================
   2) FIREBASE CONFIG (YOURS)
========================== */
const firebaseConfig = {
  apiKey: "AIzaSyBTq_1aKrXLXq20714biUn7qDRBhIBZkMo",
  authDomain: "matteoteam-test.firebaseapp.com",
  projectId: "matteoteam-test",
  storageBucket: "matteoteam-test.firebasestorage.app",
  messagingSenderId: "1084486170913",
  appId: "1:1084486170913:web:d68cf328becefe226a6660",
  measurementId: "G-9V887087P0"
};

// ✅ SuperAdmin UID (Milot)
const SUPERADMIN_UID = "zHjssSqBb4W1iffwCs9RJmfUVYJ3";


/* ==========================
   3) INIT (DATABASE IS HERE ✅)
========================== */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);   // ✅ DATABASE


/* ==========================
   4) HELPERS
========================== */
const $ = (id)=>document.getElementById(id);

function showLoginPanel(){
  $("loginPanel").classList.toggle("hidden");
}

/* ==========================
   5) BUTTON: OPEN LOGIN
========================== */
$("btnOpenLogin").onclick = showLoginPanel;


/* ==========================
   6) AUTH ACTIONS
========================== */
$("btnLogin").onclick = async ()=>{
  const email = $("email").value.trim();
  const pass  = $("pass").value;

alert("Trying login...");

  try{
    await signInWithEmailAndPassword(auth,email,pass);
    alert("Login OK ✅");
  }catch(e){
    alert(e.message);
  }
};

$("btnRegister").onclick = async ()=>{
  const email = $("email").value.trim();
  const pass  = $("pass").value;

  try{
    const cred = await createUserWithEmailAndPassword(auth,email,pass);

    // create user doc (pending) in Firestore
    await setDoc(doc(db,"users",cred.user.uid),{
      uid: cred.user.uid,
      email: cred.user.email,
      role: (cred.user.uid===SUPERADMIN_UID) ? "superadmin" : "pending",
      status: (cred.user.uid===SUPERADMIN_UID) ? "active" : "pending",
      createdAt: serverTimestamp()
    });

    alert("User created ✅ (pending)");
  }catch(e){
    alert(e.message);
  }
};

$("btnReset").onclick = async ()=>{
  const email = $("email").value.trim();
  try{
    await sendPasswordResetEmail(auth,email);
    alert("Reset email sent ✅ (check spam)");
  }catch(e){
    alert(e.message);
  }
};

$("btnLogout").onclick = async ()=>{
  await signOut(auth);
};


/* ==========================
   7) AUTH STATE
========================== */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    $("btnLogout").classList.add("hidden");
    $("btnOpenLogin").classList.remove("hidden");
    $("appPanel").classList.add("hidden");
    return;
  }

  $("loginPanel").classList.add("hidden");
  $("btnLogout").classList.remove("hidden");
  $("btnOpenLogin").classList.add("hidden");
  $("appPanel").classList.remove("hidden");

  // ensure superadmin doc always active
  if(user.uid===SUPERADMIN_UID){
    await setDoc(doc(db,"users",user.uid),{
      uid:user.uid,
      email:user.email||"",
      role:"superadmin",
      status:"active",
      updatedAt: serverTimestamp()
    },{merge:true});
  }

  // after login load modules
  await loadStaff();
  await loadWeekly();
  await loadInventory();
});

/* ==========================
   8) STAFF (Firestore: staff)
========================== */

async function loadStaff(){
  const snap = await getDocs(collection(db,"staff"));

  $("staffList").innerHTML = "";
  $("weeklyBody").innerHTML = "";

  const staffArr = [];

  snap.forEach(d=>{
    const data = d.data() || {};
    staffArr.push({
      id: d.id,
      name: data.name || "—"
    });
  });

  // sort by name
  staffArr.sort((a,b)=> (a.name||"").localeCompare(b.name||""));

  // render staff list + build weekly rows
  for(const s of staffArr){

    // staff list card
   const row = document.createElement("div");
row.style = "margin:6px 0;padding:10px;background:#1b3944;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;";

const nameSpan = document.createElement("div");
nameSpan.style.fontWeight = "700";
nameSpan.textContent = s.name;

const delBtn = document.createElement("button");
delBtn.textContent = "Delete";
delBtn.style = "background:red;color:white;border:none;padding:6px 10px;border-radius:6px";
delBtn.onclick = async () => {
  await deleteDoc(doc(db,"staff",s.id));
  await loadStaff();
};

row.appendChild(nameSpan);
row.appendChild(delBtn);

$("staffList").appendChild(row);
    // weekly table row
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td style="font-weight:700">${s.name}</td>
      <td><textarea id="w_${s.id}_mon"></textarea></td>
      <td><textarea id="w_${s.id}_tue"></textarea></td>
      <td><textarea id="w_${s.id}_wed"></textarea></td>
      <td><textarea id="w_${s.id}_thu"></textarea></td>
      <td><textarea id="w_${s.id}_fri"></textarea></td>
      <td><textarea id="w_${s.id}_sat"></textarea></td>
      <td><textarea id="w_${s.id}_sun"></textarea></td>
    `;
    $("weeklyBody").appendChild(tr);
  }

  // bind delete buttons
  document.querySelectorAll("[data-delstaff]").forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute("data-delstaff");
      await deleteDoc(doc(db,"staff",id));
      await loadStaff();
      await loadWeekly();
    };
  });

}


/* ==========================
   9) ADD STAFF
========================== */

$("btnAddStaff").onclick = async ()=>{
  const name = $("staffName").value.trim();
  if(!name) return;

  await addDoc(collection(db,"staff"),{
    name,
    createdAt: serverTimestamp()
  });

  $("staffName").value = "";

  await loadStaff();
  await loadWeekly();
};


/* ==========================
   10) WEEKLY (Firestore: weekly/week_main)
   Strukturë: weekly/week_main -> { rows: { staffId: {mon,tue..} } }
========================== */

async function loadWeekly(){
  const ref = doc(db,"weekly","week_main");
  const snap = await getDoc(ref);
  const data = snap.exists() ? (snap.data()||{}) : {};
  const rows = data.rows || {};

  // apply values
  Object.keys(rows).forEach(staffId=>{
    const r = rows[staffId] || {};
    if($("w_"+staffId+"_mon")) $("w_"+staffId+"_mon").value = r.mon || "";
    if($("w_"+staffId+"_tue")) $("w_"+staffId+"_tue").value = r.tue || "";
    if($("w_"+staffId+"_wed")) $("w_"+staffId+"_wed").value = r.wed || "";
    if($("w_"+staffId+"_thu")) $("w_"+staffId+"_thu").value = r.thu || "";
    if($("w_"+staffId+"_fri")) $("w_"+staffId+"_fri").value = r.fri || "";
    if($("w_"+staffId+"_sat")) $("w_"+staffId+"_sat").value = r.sat || "";
    if($("w_"+staffId+"_sun")) $("w_"+staffId+"_sun").value = r.sun || "";
  });
}


/* ==========================
   11) SAVE WEEKLY
========================== */

$("btnSaveWeekly").onclick = async ()=>{

  const snap = await getDocs(collection(db,"staff"));
  const rows = {};

  snap.forEach(d=>{
    const id = d.id;
    rows[id] = {
      mon: $("w_"+id+"_mon") ? $("w_"+id+"_mon").value : "",
      tue: $("w_"+id+"_tue") ? $("w_"+id+"_tue").value : "",
      wed: $("w_"+id+"_wed") ? $("w_"+id+"_wed").value : "",
      thu: $("w_"+id+"_thu") ? $("w_"+id+"_thu").value : "",
      fri: $("w_"+id+"_fri") ? $("w_"+id+"_fri").value : "",
      sat: $("w_"+id+"_sat") ? $("w_"+id+"_sat").value : "",
      sun: $("w_"+id+"_sun") ? $("w_"+id+"_sun").value : ""
    };
  });

  await setDoc(doc(db,"weekly","week_main"),{
    rows,
    updatedAt: serverTimestamp()
  },{merge:true});

  alert("Weekly Saved ✅");
};
/* ==========================
   12) INVENTORY (Firestore: inventory)
   - add item
   - list items
   - delete item
========================== */

async function loadInventory(){
  const snap = await getDocs(collection(db,"inventory"));
  $("invList").innerHTML = "";

  const items = [];
  snap.forEach(d=>{
    const data = d.data() || {};
    items.push({
      id: d.id,
      name: data.name || "—",
      qty: data.qty ?? "",
      createdAt: data.createdAt || null
    });
  });

  // sort by name
  items.sort((a,b)=> (a.name||"").localeCompare(b.name||""));

  for(const it of items){
    const div = document.createElement("div");
    div.style = "margin:6px 0;padding:10px;background:#1b3944;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;";
    div.innerHTML = `
      <div>
        <div style="font-weight:800">${it.name}</div>
        <div style="opacity:.8;font-size:12px">Qty: <b>${it.qty}</b></div>
      </div>
      <button data-delinv="${it.id}" style="background:#ff6b6b;color:white;border:none;padding:7px 10px;border-radius:6px;cursor:pointer">
        Delete
      </button>
    `;
    $("invList").appendChild(div);
  }

  // bind delete
  document.querySelectorAll("[data-delinv]").forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.getAttribute("data-delinv");
      await deleteDoc(doc(db,"inventory",id));
      await loadInventory();
    };
  });
}

$("btnAddInv").onclick = async ()=>{
  const name = $("invName").value.trim();
  const qty  = $("invQty").value;

  if(!name) return;

  await addDoc(collection(db,"inventory"),{
    name,
    qty: qty==="" ? "" : Number(qty),
    createdAt: serverTimestamp()
  });

  $("invName").value = "";
  $("invQty").value = "";

  await loadInventory();
};


/* ==========================
   13) MULTI LANGUAGE (Simple)
   - only changes visible labels
   - keeps app stable for iPhone
========================== */

const TXT = {
  de:{
    login:"Login",
    logout:"Logout",
    reset:"Passwort Reset",
    register:"Registrieren",
    weekly:"Wochenplan",
    saveWeekly:"Wochenplan speichern",
    staff:"Mitarbeiter",
    addStaff:"Mitarbeiter hinzufügen",
    staffName:"Name",
    inventory:"Inventar",
    addItem:"Artikel hinzufügen",
    itemName:"Artikel",
    qty:"Menge"
  },
  en:{
    login:"Login",
    logout:"Logout",
    reset:"Reset Password",
    register:"Register",
    weekly:"Weekly Plan",
    saveWeekly:"Save Weekly",
    staff:"Staff",
    addStaff:"Add Staff",
    staffName:"Name",
    inventory:"Inventory",
    addItem:"Add Item",
    itemName:"Item",
    qty:"Quantity"
  },
  sq:{
    login:"Login",
    logout:"Dil",
    reset:"Reset Password",
    register:"Regjistro",
    weekly:"Plani Javor",
    saveWeekly:"Ruaj Planin",
    staff:"Stafi",
    addStaff:"Shto Staf",
    staffName:"Emri",
    inventory:"Inventari",
    addItem:"Shto Produkt",
    itemName:"Produkti",
    qty:"Sasia"
  }
};

let LANG="de";

function applyLang(){
  const t = TXT[LANG] || TXT.de;

  // header buttons
  $("btnOpenLogin").innerText = t.login;
  $("btnLogout").innerText = t.logout;

  // login panel buttons
  $("btnLogin").innerText = t.login;
  $("btnRegister").innerText = t.register;
  $("btnReset").innerText = t.reset;

  // headings (simple)
  // (We keep your existing H3 texts, but we can overwrite them if you want.)
  // We'll set placeholders:
  $("staffName").placeholder = t.staffName;
  $("invName").placeholder = t.itemName;
  $("invQty").placeholder = t.qty;

  // action buttons
  $("btnSaveWeekly").innerText = t.saveWeekly;
  $("btnAddStaff").innerText = t.addStaff;
  $("btnAddInv").innerText = t.addItem;
}

$("langSel").onchange = ()=>{
  LANG = $("langSel").value;
  applyLang();
};

// apply once at start
applyLang();
/* ==========================
   14) SAFE BOOT (avoid "null" errors)
========================== */

// When page refreshes, sometimes buttons exist but data not loaded yet.
// We only load data after user is logged in (already in onAuthStateChanged).
// But we also want a clean UI when app opens.

function showLoggedOutUI(){
  $("appPanel").classList.add("hidden");
  $("loginPanel").classList.add("hidden");
  $("btnLogout").classList.add("hidden");
  $("btnOpenLogin").classList.remove("hidden");
}

function showLoggedInUI(){
  $("appPanel").classList.remove("hidden");
  $("loginPanel").classList.add("hidden");
  $("btnLogout").classList.remove("hidden");
  $("btnOpenLogin").classList.add("hidden");
}

// Override a bit: make sure UI always correct
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    showLoggedOutUI();
    return;
  }
  showLoggedInUI();

  // load everything after login
  await loadStaff();
  await loadWeekly();
  await loadInventory();
});


/* ==========================
   15) FIRST LOAD
========================== */
showLoggedOutUI();
// =========================
// SAVE WEEKLY PLAN
// =========================
$("btnSaveWeekly").onclick = async ()=>{

  const days = ["mon","tue","wed","thu","fri","sat","sun"];

  const snap = await getDocs(collection(db,"staff"));

  snap.forEach(async (docSnap)=>{

    const staffId = docSnap.id;

    const data = {};

    days.forEach(d=>{
      const el = document.getElementById(`w_${staffId}_${d}`);
      data[d] = el ? el.value : "";
    });

    await setDoc(doc(db,"weekly",staffId),data);

  });

  alert("Weekly Plan saved");

};

// ✅ END SCRIPT
</script>

</body>
</html>
