<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatteoTeam</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#071025,#0c1b33);
  color:white;
}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{
  background:rgba(255,255,255,0.06);
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
}
h1{margin:0}
input,select,textarea{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:none;
}
button{
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
}
.green{background:#22c55e}
.red{background:#ef4444}
.blue{background:#3b82f6}
.list{margin-top:10px}
.item{
  background:rgba(0,0,0,0.2);
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}
.tabs{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}
.tab{
  flex:1;
  padding:10px;
  background:#111827;
  text-align:center;
  border-radius:8px;
  cursor:pointer;
}
.tab.active{background:#3b82f6}
.hidden{display:none}
</style>
</head>

<body>
<div class="wrap">

<h1>MatteoTeam</h1>

<div class="tabs">
  <div class="tab active" onclick="showTab('njoftime')">Njoftime</div>
  <div class="tab" onclick="showTab('orar')">Orar</div>
  <div class="tab" onclick="showTab('inventar')">Inventar</div>
</div>

<div id="njoftime">
  <div class="card">
    <h3>Shto Njoftim</h3>
    <input id="title" placeholder="Titulli">
    <textarea id="body" placeholder="Mesazhi"></textarea>
    <button class="green" onclick="addPost()">Ruaj</button>
  </div>
  <div id="postList" class="list"></div>
</div>

<div id="orar" class="hidden">
  <div class="card">
    <h3>Orari Javor</h3>
    <input id="dita" placeholder="Dita (p.sh Hënë)">
    <input id="orari" placeholder="Orari (10:00 - 18:00)">
    <button class="green" onclick="addSchedule()">Ruaj Orarin</button>
  </div>
  <div id="scheduleList" class="list"></div>
</div>

<div id="inventar" class="hidden">
  <div class="card">
    <h3>Inventari</h3>
    <input id="itemName" placeholder="Produkti">
    <input id="itemQty" placeholder="Sasia">
    <button class="green" onclick="addItem()">Ruaj Produktin</button>
  </div>
  <div id="inventoryList" class="list"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTq_1aKrXLXq20",
  authDomain: "matteoteam-test.firebaseapp.com",
  projectId: "matteoteam-test",
  storageBucket: "matteoteam-test.appspot.com",
  messagingSenderId: "1084486170913",
  appId: "1:1084486170913:web:d68cf328becefe226a6660",
  measurementId: "G-9V887087P0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.showTab = function(tab){
  document.getElementById("njoftime").classList.add("hidden");
  document.getElementById("orar").classList.add("hidden");
  document.getElementById("inventar").classList.add("hidden");
  document.getElementById(tab).classList.remove("hidden");
}

window.addPost = async function(){
  await addDoc(collection(db,"posts"),{
    title: title.value,
    body: body.value
  });
  loadPosts();
}

async function loadPosts(){
  const snap = await getDocs(collection(db,"posts"));
  postList.innerHTML="";
  snap.forEach(doc=>{
    postList.innerHTML+=`<div class="item"><b>${doc.data().title}</b><br>${doc.data().body}</div>`;
  });
}
loadPosts();

window.addSchedule = async function(){
  await addDoc(collection(db,"schedule"),{
    dita: dita.value,
    orari: orari.value
  });
  loadSchedule();
}

async function loadSchedule(){
  const snap = await getDocs(collection(db,"schedule"));
  scheduleList.innerHTML="";
  snap.forEach(doc=>{
    scheduleList.innerHTML+=`<div class="item"><b>${doc.data().dita}</b><br>${doc.data().orari}</div>`;
  });
}
loadSchedule();

window.addItem = async function(){
  await addDoc(collection(db,"inventory"),{
    name: itemName.value,
    qty: itemQty.value
  });
  loadInventory();
}

async function loadInventory(){
  const snap = await getDocs(collection(db,"inventory"));
  inventoryList.innerHTML="";
  snap.forEach(doc=>{
    inventoryList.innerHTML+=`<div class="item">${doc.data().name} - ${doc.data().qty}</div>`;
  });
}
loadInventory();

</script>
</body>
</html>
