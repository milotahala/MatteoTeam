<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatteoTeam</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg,#0f0f0f,#1a1a1a);
  color:white;
  text-align:center;
}

header{
  padding:60px 20px;
}

h1{
  font-size:48px;
  margin:0;
  color:#d4af37;
  letter-spacing:2px;
}

.subtitle{
  font-size:18px;
  opacity:0.8;
  margin-top:10px;
}

.button{
  margin-top:25px;
  padding:14px 28px;
  font-size:16px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.button:hover{
  background:white;
}

.section{
  padding:40px 20px;
}

.card{
  background:#1e1e1e;
  margin:15px auto;
  padding:25px;
  border-radius:15px;
  max-width:300px;
  box-shadow:0 0 20px rgba(212,175,55,0.2);
}

.card h3{
  color:#d4af37;
}

footer{
  margin-top:50px;
  padding:20px;
  font-size:14px;
  opacity:0.6;
}
</style>
</head>

<body>

<header>
  <h1>MatteoTeam</h1>
  <div class="subtitle">Premium Restaurant Management System</div>
  <button class="button" onclick="alert('MatteoTeam po funksionon perfekt!')">Hap Aplikacionin</button>
</header>

<div class="section">
  <div class="card">
    <h3>📋 Porositë</h3>
    <p>Menaxho porositë në kohë reale.</p>
  </div>

  <div class="card">
    <h3>🍽️ Menu</h3>
    <p>Ndrysho artikujt dhe çmimet lehtë.</p>
  </div>

  <div class="card">
    <h3>📊 Raporte</h3>
    <p>Shiko statistikat dhe fitimet.</p>
  </div>
</div>

<footer>
© 2026 MatteoTeam • Powered by GitHub Pages
</footer>

</body>
</html>
