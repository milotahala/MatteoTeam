<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MatteoTeam PRO</title>

<style>
:root{
  --bg1:#0e1a20;
  --bg2:#15313a;
  --accent:#2dd4bf;
  --accent2:#38bdf8;
  --danger:#fb7185;
  --ok:#34d399;
  --warn:#fbbf24;
  --text:#e9f2f5;
  --muted:rgba(233,242,245,.7);
  --line:rgba(255,255,255,.12);
}

body{
  margin:0;
  font-family:system-ui;
  color:var(--text);
  background:
    linear-gradient(180deg,var(--bg1),var(--bg2));
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  margin-top:20px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.3);
  color:white;
}

button{
  padding:12px 18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

.btn{ background:var(--accent); color:black; }
.btnDanger{ background:var(--danger); color:white; }
.btnSecondary{ background:rgba(255,255,255,.2); color:white; }

.hidden{ display:none; }

.notice{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  font-size:14px;
}

.notice.ok{ background:rgba(52,211,153,.2); }
.notice.bad{ background:rgba(251,113,133,.2); }
.notice.warn{ background:rgba(251,191,36,.2); }

.tabs{
  margin-top:20px;
  display:flex;
  gap:10px;
}

.tab{
  padding:10px 16px;
  border-radius:999px;
  background:rgba(255,255,255,.1);
  cursor:pointer;
}

.tab.active{
  background:var(--accent);
  color:black;
}
</style>
</head>

<body>
<div class="wrap">

<h1>MatteoTeam PRO</h1>

<div id="authSection" class="card">

<h2>Login</h2>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPass" type="password" placeholder="Password">
<button class="btn" id="btnLogin">Login</button>
<button class="btnSecondary" id="btnReset">Reset</button>
<div id="noticeAuth" class="notice hidden"></div>

<hr>

<h2>Register</h2>
<input id="regName" type="text" placeholder="Full Name">
<select id="regRole">
<option value="staff">Staff</option>
<option value="admin">Admin</option>
</select>
<input id="regEmail" type="email" placeholder="Email">
<input id="regPass" type="password" placeholder="Password (min 6)">
<button class="btn" id="btnRegister">Create</button>
<div id="noticeReg" class="notice hidden"></div>

</div>
<!-- ================= APP SECTION ================= -->

<div id="appSection" class="card hidden">

<div style="display:flex;justify-content:space-between;align-items:center;">
<div>
<b id="userName">—</b> |
<span id="userRole">—</span> |
<span id="userStatus">—</span>
</div>
<div>
<button class="btnSecondary" id="btnLogout">Logout</button>
</div>
</div>

<div class="tabs">
<div class="tab active" data-tab="home">Dashboard</div>
<div class="tab" data-tab="week">Weekly</div>
<div class="tab" data-tab="inventory">Inventory</div>
<div class="tab hidden" id="tabAdmin" data-tab="admin">Admin</div>
<div class="tab hidden" id="tabPending" data-tab="pending">Pending</div>
</div>

<div id="noticeApp" class="notice hidden"></div>

<!-- DASHBOARD -->
<div id="tab_home" class="tabContent">

<h3>Announcement</h3>
<div id="announcementBox" class="notice"></div>

</div>

<!-- WEEKLY PLAN -->
<div id="tab_week" class="tabContent hidden">

<h3>Weekly Plan</h3>

<input id="weekKey" placeholder="2026-W01">
<button class="btnSecondary" id="btnLoadWeek">Load</button>
<button class="btn" id="btnSaveWeek">Save</button>

<div id="weekNotice" class="notice hidden"></div>

<table border="1" width="100%" style="margin-top:15px;">
<thead>
<tr>
<th>Shift</th>
<th>Mon</th>
<th>Tue</th>
<th>Wed</th>
<th>Thu</th>
<th>Fri</th>
<th>Sat</th>
<th>Sun</th>
</tr>
</thead>
<tbody id="weekBody"></tbody>
</table>

</div>

<!-- INVENTORY -->
<div id="tab_inventory" class="tabContent hidden">

<h3>Inventory</h3>

<input id="invName" placeholder="Name">
<input id="invUnit" placeholder="Unit">
<input id="invQty" type="number" placeholder="Start qty">
<button class="btn" id="btnAddItem">Add Item</button>

<div id="inventoryList"></div>

</div>

<!-- ADMIN -->
<div id="tab_admin" class="tabContent hidden">

<h3>Announcement Text</h3>
<input id="announcementInput" placeholder="Message">
<button class="btn" id="btnSaveAnnouncement">Save</button>

</div>

<!-- PENDING USERS -->
<div id="tab_pending" class="tabContent hidden">

<h3>Pending Users</h3>
<div id="pendingList"></div>

</div>

</div>
<!-- ================= FIREBASE LOGIC ================= -->

<script type="module">

/* ================== FIREBASE IMPORTS ================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ================== CONFIG ================== */
const firebaseConfig = {
  apiKey: "AIzaSyBTq_1aKrXLXq20714biUn7qDRBhIBZkMo",
  authDomain: "matteoteam-test.firebaseapp.com",
  projectId: "matteoteam-test",
  storageBucket: "matteoteam-test.firebasestorage.app",
  messagingSenderId: "1084486170913",
  appId: "1:1084486170913:web:d68cf328becefe226a6660"
};

const SUPERADMIN_UID = "zHjssSqBb4W1iffwCs9RJmfUVYJ3";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

/* ================== LOGIN ================== */
$("btnLogin").onclick = async () => {
  try{
    await signInWithEmailAndPassword(auth,$("loginEmail").value,$("loginPass").value);
  }catch(e){
    showNotice("noticeAuth",e.message,"bad");
  }
};

$("btnReset").onclick = async () => {
  try{
    await sendPasswordResetEmail(auth,$("loginEmail").value);
    showNotice("noticeAuth","Reset email sent","ok");
  }catch(e){
    showNotice("noticeAuth",e.message,"bad");
  }
};

/* ================== REGISTER ================== */
$("btnRegister").onclick = async () => {
  try{
    const cred = await createUserWithEmailAndPassword(auth,$("regEmail").value,$("regPass").value);
    const uid = cred.user.uid;

    await setDoc(doc(db,"users",uid),{
      fullName:$("regName").value,
      role:$("regRole").value==="admin"?"staff":"staff",
      roleRequested:$("regRole").value,
      status:$("regRole").value==="admin"?"pending":"active",
      active:$("regRole").value==="admin"?false:true,
      createdAt:serverTimestamp()
    });

    showNotice("noticeReg","Account created","ok");

  }catch(e){
    showNotice("noticeReg",e.message,"bad");
  }
};

/* ================== LOGOUT ================== */
$("btnLogout").onclick = async ()=>{ await signOut(auth); };

/* ================== AUTH STATE ================== */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    $("authSection").classList.remove("hidden");
    $("appSection").classList.add("hidden");
    return;
  }

  $("authSection").classList.add("hidden");
  $("appSection").classList.remove("hidden");

  if(user.uid===SUPERADMIN_UID){
    await setDoc(doc(db,"users",user.uid),{
      fullName:"Milot",
      role:"superadmin",
      status:"active",
      active:true
    },{merge:true});
  }

  const snap = await getDoc(doc(db,"users",user.uid));
  const data = snap.data();

  $("userName").textContent = data.fullName;
  $("userRole").textContent = data.role;
  $("userStatus").textContent = data.status;

  if(data.role==="admin"||data.role==="superadmin"){
    $("tabAdmin").classList.remove("hidden");
  }

  if(user.uid===SUPERADMIN_UID){
    $("tabPending").classList.remove("hidden");
  }
});

/* ================== WEEK TABLE ================== */
const shifts=["Morning","Noon","Evening"];
const days=["mon","tue","wed","thu","fri","sat","sun"];
const weekBody=$("weekBody");

shifts.forEach(s=>{
  const tr=document.createElement("tr");
  tr.innerHTML="<td>"+s+"</td>";
  days.forEach(d=>{
    tr.innerHTML+=`<td><textarea data-key="${d}_${s}"></textarea></td>`;
  });
  weekBody.appendChild(tr);
});

$("btnSaveWeek").onclick=async()=>{
  const week=$("weekKey").value;
  const cells={};
  document.querySelectorAll("#weekBody textarea").forEach(t=>{
    cells[t.dataset.key]=t.value;
  });
  await setDoc(doc(db,"weeklyPlans",week),{cells});
  showNotice("weekNotice","Saved","ok");
};

$("btnLoadWeek").onclick=async()=>{
  const week=$("weekKey").value;
  const snap=await getDoc(doc(db,"weeklyPlans",week));
  if(!snap.exists()) return;
  const data=snap.data().cells;
  document.querySelectorAll("#weekBody textarea").forEach(t=>{
    t.value=data[t.dataset.key]||"";
  });
};

/* ================== INVENTORY ================== */
$("btnAddItem").onclick=async()=>{
  await addDoc(collection(db,"inventory"),{
    name:$("invName").value,
    unit:$("invUnit").value,
    qty:Number($("invQty").value),
    createdAt:serverTimestamp()
  });
  loadInventory();
};

async function loadInventory(){
  const snap=await getDocs(collection(db,"inventory"));
  $("inventoryList").innerHTML="";
  snap.forEach(docu=>{
    const d=docu.data();
    $("inventoryList").innerHTML+=`
    <div>
      ${d.name} - ${d.qty} ${d.unit}
      <button onclick="deleteItem('${docu.id}')">X</button>
    </div>`;
  });
}

window.deleteItem=async(id)=>{
  await deleteDoc(doc(db,"inventory",id));
  loadInventory();
};

/* ================== PENDING USERS ================== */
async function loadPending(){
  const q=query(collection(db,"users"),where("status","==","pending"));
  const snap=await getDocs(q);
  $("pendingList").innerHTML="";
  snap.forEach(d=>{
    const u=d.data();
    $("pendingList").innerHTML+=`
    <div>
      ${u.fullName}
      <button onclick="approveUser('${d.id}')">Approve</button>
    </div>`;
  });
}

window.approveUser=async(id)=>{
  await updateDoc(doc(db,"users",id),{
    role:"admin",
    status:"active",
    active:true
  });
  loadPending();
};

/* ================== ANNOUNCEMENT ================== */
$("btnSaveAnnouncement").onclick=async()=>{
  await setDoc(doc(db,"settings","app"),{
    announcement:$("announcementInput").value
  });
};

function showNotice(id,msg,type){
  const el=$(id);
  el.textContent=msg;
  el.className="notice "+type;
  el.classList.remove("hidden");
}

</script>

</body>
</html>
