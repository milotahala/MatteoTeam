
<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatteoTeam PRO</title>
  <style>
    /* (Përmbledhje CSS të ngjashme me origjinalin, pa ndryshime të mëdha vizuale) */
    :root{
      --bg:#0f172a;
      --panel:#111827;
      --panel2:#1f2937;
      --line:#334155;
      --text:#e5e7eb;
      --muted:#94a3b8;
      --green:#22c55e;
      --blue:#38bdf8;
      --red:#ef4444;
      --orange:#f59e0b;
      --radius:18px;
      --shadow:0 12px 28px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;
      background:linear-gradient(180deg,#0b1220,#0f172a 35%,#111827);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }
    button,input,select,textarea{font:inherit}
    .hidden{display:none!important}
    .app{max-width:1500px;margin:0 auto;padding:14px}
    .card{ background:rgba(17,24,39,.92); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow); padding:16px; }
    /* Shtesa elemente të thjeshta UI */
    .authWrap{ max-width:980px; margin:30px auto; display:grid; grid-template-columns:1.1fr .9fr; gap:16px; }
    .hero{ padding:26px }
    .hero h1{ margin:0 0 8px;font-size:34px }
    .hero p{ color:var(--muted); line-height:1.6 }
    .heroGrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:18px; }
    .mini{ padding:14px; border-radius:18px; background:#132033; border:1px solid var(--line); }
    .authCard{ padding:22px }
    .tabs{ display:flex; gap:8px; margin-bottom:14px }
    .tabBtn,.navBtn,.btn,.btnDanger,.btnWarn,.ghost,.langBtn{ border:none; cursor:pointer; border-radius:14px; padding:10px 14px; font:inherit }
    .tabBtn,.navBtn,.ghost,.langBtn{ background:#182536; color:var(--text); border:1px solid #324359 }
    .tabBtn.active,.navBtn.active,.langBtn.active{ background:linear-gradient(135deg,#166534,#16a34a); border-color:transparent; }
    .btn{ background:linear-gradient(135deg,#15803d,#22c55e); color:#05131f; font-weight:800; }
    .btnDanger{ background:linear-gradient(135deg,#b91c1c,#ef4444); color:#fff; font-weight:800; }
    .btnWarn{ background:linear-gradient(135deg,#b45309,#f59e0b); color:#fff; font-weight:800; }
    .input,.select,.textarea{ width:100%; padding:12px 13px; border-radius:14px; border:1px solid #314159; background:#0f1a2b; color:var(--text); }
    .textarea{ min-height:90px; resize:vertical }
    .field{ margin-bottom:12px }
    .label{ display:block; margin-bottom:7px; font-size:13px; color:var(--muted); }
    .muted{ color:var(--muted) }
