<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MatteoTeam</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}
.container{padding:20px;}
.card{
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}
input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}
button{
  padding:10px 15px;
  border:none;
  border-radius:8px;
  margin:5px 0;
  cursor:pointer;
}
.btn-primary{background:#3b82f6;color:white;}
.btn-danger{background:#ef4444;color:white;}
.hidden{display:none;}
.nav button{margin-right:5px;}
.list-item{
  background:rgba(255,255,255,0.05);
  padding:10px;
  margin-top:5px;
  border-radius:8px;
}
.status{margin-top:10px;font-size:14px;}
</style>
</head>
<body>

<div class="container">

<h1>MatteoTeam</h1>
<div id="status" class="status">Status: Gati</div>

<div id="authCard" class="card">
<h2>Hyrja / Regjistrimi</h2>
<input type="email" id="email" placeholder="Email"/>
<input type="password" id="password" placeholder="Fjalëkalimi"/>
<button class="btn-primary" id="loginBtn">Login</button>
<button class="btn-primary" id="registerBtn">Register</button>
</div>

<div id="appPanel" class="hidden">

<div class="nav">
<button id="navPosts">Njoftime</button>
<button id="navSchedule">Orar</button>
<button id="navInventory">Inventar</button>
<button id="logoutBtn" class="btn-danger">Logout</button>
</div>

<!-- NJOFTIME -->
<div id="postsSection" class="card hidden">
<h2>Njoftime</h2>
<input type="text" id="postTitle" placeholder="Titulli"/>
<input type="text" id="postBody" placeholder="Mesazhi"/>
<button id="addPostBtn" class="btn-primary">Shto</button>
<div id="postsList"></div>
</div>

<!-- ORAR -->
<div id="scheduleSection" class="card hidden">
<h2>Orar</h2>
<input type="text" id="scheduleText" placeholder="Shkruaj orarin"/>
<button id="addScheduleBtn" class="btn-primary">Ruaj</button>
<div id="scheduleList"></div>
</div>

<!-- INVENTAR -->
<div id="inventorySection" class="card hidden">
<h2>Inventar</h2>
<input type="text" id="invName" placeholder="Produkti"/>
<input type="number" id="invQty" placeholder="Sasia"/>
<button id="addInvBtn" class="btn-primary">Ruaj</button>
<div id="inventoryList"></div>
</div>

</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_AUTH_DOMAIN",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_STORAGE",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const statusDiv = document.getElementById("status");

const authCard = document.getElementById("authCard");
const appPanel = document.getElementById("appPanel");

const postsSection = document.getElementById("postsSection");
const scheduleSection = document.getElementById("scheduleSection");
const inventorySection = document.getElementById("inventorySection");

document.getElementById("navPosts").onclick=()=>show(postsSection);
document.getElementById("navSchedule").onclick=()=>show(scheduleSection);
document.getElementById("navInventory").onclick=()=>show(inventorySection);

function show(section){
postsSection.classList.add("hidden");
scheduleSection.classList.add("hidden");
inventorySection.classList.add("hidden");
section.classList.remove("hidden");
}

document.getElementById("registerBtn").onclick=()=>{
createUserWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>statusDiv.textContent="Gabim: "+e.message);
};

document.getElementById("loginBtn").onclick=()=>{
signInWithEmailAndPassword(auth,email.value,password.value)
.catch(e=>statusDiv.textContent="Gabim: "+e.message);
};

document.getElementById("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
if(user){
authCard.classList.add("hidden");
appPanel.classList.remove("hidden");
statusDiv.textContent="I loguar: "+user.email;
loadAll();
}else{
authCard.classList.remove("hidden");
appPanel.classList.add("hidden");
statusDiv.textContent="Status: Gati";
}
});

async function loadAll(){
loadPosts();
loadSchedule();
loadInventory();
}

async function loadPosts(){
postsList.innerHTML="";
const snap=await getDocs(collection(db,"posts"));
snap.forEach(doc=>{
postsList.innerHTML+=`<div class="list-item">${doc.data().title}</div>`;
});
}

async function loadSchedule(){
scheduleList.innerHTML="";
const snap=await getDocs(collection(db,"schedule"));
snap.forEach(doc=>{
scheduleList.innerHTML+=`<div class="list-item">${doc.data().text}</div>`;
});
}

async function loadInventory(){
inventoryList.innerHTML="";
const snap=await getDocs(collection(db,"inventory"));
snap.forEach(doc=>{
inventoryList.innerHTML+=`<div class="list-item">${doc.data().name} (${doc.data().qty})</div>`;
});
}

addPostBtn.onclick=async()=>{
await addDoc(collection(db,"posts"),{
title:postTitle.value,
body:postBody.value,
created_at:serverTimestamp()
});
postTitle.value="";
postBody.value="";
loadPosts();
};

addScheduleBtn.onclick=async()=>{
await addDoc(collection(db,"schedule"),{
text:scheduleText.value,
created_at:serverTimestamp()
});
scheduleText.value="";
loadSchedule();
};

addInvBtn.onclick=async()=>{
await addDoc(collection(db,"inventory"),{
name:invName.value,
qty:invQty.value,
created_at:serverTimestamp()
});
invName.value="";
invQty.value="";
loadInventory();
};

</script>
</body>
</html>
