<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MatteoTeam</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#071025,#0c1b33);
  color:white;
}
.wrap{max-width:900px;margin:auto;padding:20px;}
.card{
  background:rgba(255,255,255,0.06);
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
}
button{
  padding:10px 15px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
.green{background:#1cc26b;color:white;}
.red{background:#e74c3c;color:white;}
.blue{background:#3498db;color:white;}
input,select{
  width:100%;
  padding:8px;
  margin:5px 0;
  border-radius:6px;
  border:none;
}
.tabbar{
  display:flex;
  gap:10px;
  margin-top:15px;
}
.tab{
  flex:1;
  text-align:center;
  padding:10px;
  background:#16233d;
  border-radius:10px;
  cursor:pointer;
}
.active{background:#1cc26b;}
.hidden{display:none;}
</style>
</head>

<body>
<div class="wrap">

<h1>MatteoTeam</h1>

<!-- LOGIN -->
<div class="card" id="loginCard">
<h3>Hyrja</h3>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="green" onclick="login()">Login</button>
</div>

<!-- PANEL -->
<div id="app" class="hidden">

<div class="tabbar">
<div class="tab active" onclick="showTab('posts')">Njoftime</div>
<div class="tab" onclick="showTab('schedule')">Orari</div>
<div class="tab" onclick="showTab('admin')">Admin</div>
<div class="tab" onclick="showTab('profile')">Profil</div>
</div>

<!-- POSTS -->
<div id="posts" class="card">
<h3>Njoftime</h3>
<input id="postTitle" placeholder="Titulli">
<input id="postBody" placeholder="Mesazhi">
<button class="green" onclick="addPost()">Shto</button>
<div id="postList"></div>
</div>

<!-- SCHEDULE -->
<div id="schedule" class="card hidden">
<h3>Orari Javor</h3>
<input id="day" placeholder="Dita (p.sh Monday)">
<input id="shift" placeholder="Orari (10:00 - 18:00)">
<button class="green" onclick="saveSchedule()">Ruaj</button>
<div id="scheduleList"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="card hidden">
<h3>Admin Panel</h3>
<input id="uid" placeholder="UID i user-it">
<select id="role">
<option value="user">User</option>
<option value="admin">Admin</option>
</select>
<button class="blue" onclick="setRole()">Ruaj rolin</button>
</div>

<!-- PROFILE -->
<div id="profile" class="card hidden">
<h3>Profili</h3>
<div id="profileData"></div>
<button class="red" onclick="logout()">Logout</button>
</div>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_AUTH_DOMAIN",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_BUCKET",
  messagingSenderId: "PASTE_MSG_ID",
  appId: "PASTE_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

window.login = async function(){
  await signInWithEmailAndPassword(auth,email.value,password.value);
}

window.logout = async function(){
  await signOut(auth);
}

onAuthStateChanged(auth, async (user)=>{
  if(user){
    loginCard.classList.add("hidden");
    app.classList.remove("hidden");
    loadPosts();
    loadSchedule();
    profileData.innerHTML = "Email: "+user.email;
  }else{
    loginCard.classList.remove("hidden");
    app.classList.add("hidden");
  }
});

window.addPost = async function(){
  await addDoc(collection(db,"posts"),{
    title:postTitle.value,
    body:postBody.value
  });
  loadPosts();
}
